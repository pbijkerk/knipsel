name: Knipsel
options:
  bundleIdPrefix: com.peterbijkerk
  # Nederlands is de brontaal: ook de Siri-zinnen (AppShortcuts.xcstrings) zijn Nederlands.
  developmentLanguage: nl
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # iPhone én iPad.
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Knipsel:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Knipsel
        excludes:
          - "**/*.md"
    settings:
      base:
        # Nooit wijzigen na de eerste TestFlight-build: een nieuwe ID is voor iOS een andere app.
        PRODUCT_BUNDLE_IDENTIFIER: com.peterbijkerk.knipsel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Knipsel/Info.plist
        # iCloud (CloudKit-container iCloud.com.peterbijkerk.knipsel) + push voor sync-meldingen, en
        # App Group group.com.peterbijkerk.knipsel (gedeeld met de deel-extensie).
        CODE_SIGN_ENTITLEMENTS: Knipsel/Knipsel.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 68K8BCC3DL
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      # De deel-extensie zit in de app (PlugIns/KnipselDelen.appex).
      - target: KnipselDelen
        embed: true
    scheme:
      testTargets:
        - KnipselTests

  # "Knipsel" in het deelmenu (#18): zet links, tekst, afbeeldingen en PDF's via de App Group in
  # "Nog te controleren". Eigen app-ID com.peterbijkerk.knipsel.delen; versie en buildnummer komen
  # uit de projectinstellingen hierboven, gelijk aan de app.
  KnipselDelen:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: KnipselDelen
      # Gedeeld met de app: DeelPost/DeelBus, DeelLezer en het bevestigingsscherm. Niets anders uit
      # de app (geen Core Data, geen netwerk) — de extensie heeft weinig geheugen.
      - path: Knipsel/Delen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peterbijkerk.knipsel.delen
        INFOPLIST_FILE: KnipselDelen/Info.plist
        CODE_SIGN_ENTITLEMENTS: KnipselDelen/KnipselDelen.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 68K8BCC3DL
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  KnipselTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: KnipselTests
        excludes:
          - "Resources/**"
      # Testpagina uit docs/spikes (verzonnen): de eind-tot-eindtest van herkennen en indelen.
      - path: KnipselTests/Resources
        buildPhase: resources
    dependencies:
      - target: Knipsel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peterbijkerk.knipsel.tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 68K8BCC3DL
        GENERATE_INFOPLIST_FILE: YES
